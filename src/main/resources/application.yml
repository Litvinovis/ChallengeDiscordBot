# Конфигурация Discord бота
# Все логи, сообщения и комментарии в проекте на русском языке
# Для локали используем запятую как десятичный разделитель

discord:
  token: ${DISCORD_BOT_TOKEN:} # Токен Discord бота из переменной окружения
  channel: "качал-очка"        # Название канала, где бот отвечает (fallback)
  channel-ids:                 # Приоритетный список ID каналов для команд
    - "1068647322373861416"
    - "1413824920881729557"
  report-guild-id: 651802173495181322 # ID сервера Discord для отправки отчетов
  admin-user-ids: 
    - 253576055317594114 # ID пользователя с правами администратора
  report-channel: "качал-очка"    # Название канала для отчетов и уведомлений о завершении испытаний

ignite:
  local-address: "192.168.1.120"
  discovery-addresses:
    - "192.168.1.120:47650..47659"
  work-dir: "/tmp/ignite-challenge-client"

# Конфигурация запланированных задач
scheduled:
  enabled: true
  cron:
    daily-report: "0 0 7 * * ?"  # Каждый день в 7:00

# Настройки визуализации
visualization:
  enabled: true
  max-width: 400
  max-height: 300
  format: "png"