# Конфигурация Discord бота
# Все логи, сообщения и комментарии в проекте на русском языке
# Для локали используем запятую как десятичный разделитель

discord:
  token: ${DISCORD_BOT_TOKEN:} # Токен Discord бота из переменной окружения
  channel: ${DISCORD_CHANNEL_NAME:качал-очка}        # Название канала, где бот отвечает (fallback)
  channel-ids:                 # Приоритетный список ID каналов для команд
    - ${DISCORD_CHANNEL_ID_1:}
    - ${DISCORD_CHANNEL_ID_2:}
  report-guild-id: ${DISCORD_REPORT_GUILD_ID:} # ID сервера Discord для отправки отчетов
  admin-user-ids:
    - ${DISCORD_ADMIN_USER_ID:} # ID пользователя с правами администратора
  report-channel: ${DISCORD_REPORT_CHANNEL:качал-очка}    # Название канала для отчетов и уведомлений о завершении испытаний

ignite:
  local-address: ${IGNITE_LOCAL_ADDRESS:127.0.0.1}
  discovery-addresses:
    - ${IGNITE_DISCOVERY_ADDRESSES:127.0.0.1:47650..47659}
  work-dir: "${IGNITE_WORK_DIR:/tmp/ignite-challenge-client}"

# Конфигурация запланированных задач
scheduled:
  enabled: true
  cron:
    daily-report: "0 0 7 * * ?"  # Каждый день в 7:00

# Настройки визуализации
visualization:
  enabled: true
  max-width: 400
  max-height: 300
  format: "png"
