name: Build & Deploy — Challenge Bot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        default: 'main'
        required: false

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Java 25
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-25-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Build & Test
        run: mvn package -B

      - name: Deploy (only on push/dispatch to main)
        if: github.event_name != 'pull_request'
        run: |
          DEPLOY_DIR=/opt/challengeBot
          SERVICE=bot-challenge

          # Find current and new jar
          NEW_JAR=$(ls target/challenge-bot-*.jar | grep -v original | head -1)
          JAR_NAME=$(basename "$NEW_JAR")

          # Backup current jar(s): юнит запускает jar по маске, лишний jar ломает запуск
          for CURRENT_JAR in ${DEPLOY_DIR}/challenge-bot-*.jar; do
            [ -e "$CURRENT_JAR" ] || continue
            sudo cp "$CURRENT_JAR" "${CURRENT_JAR}.backup.$(date +%Y%m%d_%H%M)"
            sudo rm "$CURRENT_JAR"
          done

          # Ротация: для отката нужен только свежий бэкап, остальные копились без предела
          # (по 25–60 МБ за деплой). Оставляем три последних.
          ls -t ${DEPLOY_DIR}/challenge-bot-*.jar.backup.* 2>/dev/null | tail -n +4 | sudo xargs -r rm -f

          # Deploy new jar
          sudo cp "$NEW_JAR" "${DEPLOY_DIR}/${JAR_NAME}"

          # Restart service
          sudo systemctl restart ${SERVICE}

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          echo "Waiting for bot to start..."
          RESTARTS_BEFORE=$(systemctl show -p NRestarts --value bot-challenge)
          sleep 20
          STATUS=$(sudo systemctl is-active bot-challenge)
          RESTARTS_AFTER=$(systemctl show -p NRestarts --value bot-challenge)
          # Restart=always: падающий в цикле сервис может попасть на момент "active"
          if [ "$STATUS" != "active" ] || [ "$RESTARTS_AFTER" != "$RESTARTS_BEFORE" ]; then
            echo "❌ Bot failed to start (status=$STATUS, restarts $RESTARTS_BEFORE→$RESTARTS_AFTER), rolling back..."
            LATEST_BACKUP=$(ls -t /opt/challengeBot/challenge-bot-*.backup.* 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              RESTORE_NAME=$(echo "$LATEST_BACKUP" | sed 's/\.backup\.[0-9_]*//')
              # Убираем новый jar: при смене версии в имени рядом остались бы два
              # challenge-bot-*.jar, и маска в ExecStart подхватила бы оба.
              sudo find /opt/challengeBot -maxdepth 1 -name 'challenge-bot-*.jar' ! -name "$(basename "$RESTORE_NAME")" -delete
              sudo cp "$LATEST_BACKUP" "$RESTORE_NAME"
              sudo systemctl restart bot-challenge
            fi
            exit 1
          fi
          echo "✅ Bot is running fine"

      - name: Notify Telegram
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *Challenge Bot* задеплоен%0Aветка: \`${{ github.ref_name }}\`%0Aкоммит: ${{ github.sha }}"
          else
            MSG="❌ *Challenge Bot* — деплой упал%0Aветка: \`${{ github.ref_name }}\`%0Aсмотри: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null
